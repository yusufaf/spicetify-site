name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net in case a dispatch from an extension repo is missed.
  schedule:
    - cron: '0 6 * * 1'
  # Sent by notify-docs.yml in each extension repo when its README, changelog,
  # manifest or images change on main.
  repository_dispatch:
    types: [extension-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # `prebuild` syncs every extension's README and changelog first.
      - name: Build site
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
