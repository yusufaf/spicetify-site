name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net in case a dispatch from an extension repo is missed.
  schedule:
    - cron: '0 6 * * 1'
  # Sent by notify-docs.yml in each extension repo when its README, changelog,
  # manifest or images change on main.
  repository_dispatch:
    types: [extension-updated]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Public by design: the same value is served at /<key>.txt (public/) to prove
  # the site owns it.
  INDEXNOW_KEY: 3eb0955b316f44a3815905b25c07050a

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # `prebuild` syncs every extension's README and changelog first.
      - name: Build site
        run: pnpm run build

      # Hashes each page into dist/indexnow-pages.json and lists the ones that
      # differ from the live site; the indexnow job submits them once deployed.
      - name: Plan IndexNow submission
        run: node scripts/indexnow.mjs dist https://spicetify.yusufaf.dev/ "$INDEXNOW_KEY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload IndexNow request
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-request
          path: indexnow-request.json

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Download IndexNow request
        uses: actions/download-artifact@v8
        with:
          name: indexnow-request

      - name: Submit changed pages
        run: |
          if [ "$(jq '.urlList | length' indexnow-request.json)" -eq 0 ]; then
            echo "No pages changed"
            exit 0
          fi
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow-request.json -w 'IndexNow: HTTP %{http_code}\n'
